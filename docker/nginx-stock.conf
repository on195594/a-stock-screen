# Log paths only: OAuth /oauth_callback query parameters include authorization codes.
log_format stock_no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream stock_workbench {
    zone upstream_stock 64k;
    server a-stock-screen-web:8550 max_fails=1 fail_timeout=2s;
    keepalive 32;
    keepalive_timeout 65s;
    keepalive_requests 100;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name stock.keyi.win;

    # SSL
    ssl_certificate ssl/keyi.win.pem;
    ssl_certificate_key ssl/keyi.win.key;

    # Security headers (allowing Flutter WASM execution)
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Content-Security-Policy   "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; frame-ancestors 'self';" always;
    add_header Permissions-Policy        "interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Logging & client body
    access_log log/stock_access.log stock_no_query;
    error_log log/stock_error.log warn;
    client_max_body_size 16m;

    # 0-RTT QUIC connection resumption
    ssl_early_data on;
    ssl_session_ticket_key ssl/ticket.key;

    # HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header QUIC-Status $http3;

    # OAuth codes can also appear in upstream error logs; never persist callback requests.
    location = /oauth_callback {
        access_log off;
        error_log /dev/null;
        proxy_pass http://stock_workbench;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        include nginxconfig.io/proxy.conf;
    }

    # Reverse proxy for Flet Web & WebSocket
    location / {
        proxy_pass http://stock_workbench;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        include nginxconfig.io/proxy.conf;
    }

    # Additional config
    include nginxconfig.io/general.conf;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name stock.keyi.win;
    access_log log/stock_access.log stock_no_query;
    return 301 https://stock.keyi.win$request_uri;
}
